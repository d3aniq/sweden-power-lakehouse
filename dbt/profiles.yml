sweden_power_lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      host: dbc-be67c292-5250.cloud.databricks.com
      http_path: /sql/1.0/warehouses/2b656d5fcdf39207
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
